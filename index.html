<style>
  /* Paleta JARVIS del Motor Agentico (palette.ts) */
  :root {
    --bg: #050505; --bg2: #0a0a0a; --panel: #161104;
    --gold: #F5B301; --gold-hi: #FFD400; --gold-deep: #6b4e0a;
    --cream: #F0ECE0; --muted: #8a8576;
    --green: #36d98a; --pink: #ED93B1; --orange: #EF9F27; --blue: #5aa6ef; --violet: #9a7bd6;
    --line: rgba(245,179,1,0.16);
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: var(--mono); overflow: hidden; }
  .stage { position: fixed; inset: 10px; border: 1px solid var(--line); background: radial-gradient(ellipse at 50% 55%, #0d0b05 0%, var(--bg) 70%); }
  .stage::after { content: ""; position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); opacity: .7; pointer-events: none; }
  .stage::before { content: ""; position: absolute; bottom: 10px; left: 10px; width: 18px; height: 18px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); opacity: .7; pointer-events: none; }
  canvas { position: absolute; inset: 0; display: block; touch-action: none; cursor: grab; }

  header { position: absolute; top: 18px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; padding: 0 16px; }
  h1 { margin: 0; font-family: "Orbitron", var(--mono); font-weight: 700; font-size: clamp(18px, 2.6vw, 26px); letter-spacing: .14em; color: var(--gold); text-shadow: 0 0 18px rgba(245,179,1,.35); }
  .sub { margin: 6px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .03em; }
  .sub b { color: var(--cream); font-weight: 500; }

  .pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; pointer-events: auto; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 1px solid rgba(240,236,224,.18); background: rgba(10,10,10,.75); color: var(--cream); font: 500 13px var(--mono); cursor: pointer; transition: border-color .15s, background .15s; }
  .pill:hover { border-color: rgba(245,179,1,.5); }
  .pill .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #1a1a1a; font-size: 11px; }
  .pill[aria-pressed="true"] { border-color: var(--gold); background: rgba(245,179,1,.10); box-shadow: 0 0 0 1px rgba(245,179,1,.25) inset; }
  .pill:focus-visible, .ctl:focus-visible, .nb:focus-visible, .open:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

  .controls { position: absolute; top: 18px; right: 40px; display: flex; flex-direction: column; gap: 6px; z-index: 3; align-items: flex-end; }
  .row { display: flex; gap: 6px; }
  .ctl { padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(240,236,224,.16); background: rgba(10,10,10,.8); color: var(--muted); font: 500 11px var(--mono); cursor: pointer; letter-spacing: .04em; }
  .ctl[aria-pressed="true"] { color: var(--gold); border-color: rgba(245,179,1,.45); }
  .search { width: 190px; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(240,236,224,.16); background: rgba(10,10,10,.85); color: var(--cream); font: 12px var(--mono); }
  .search::placeholder { color: #6f6b60; }
  .search:focus { outline: none; border-color: var(--gold); }

  .legend { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); z-index: 2; pointer-events: none; padding: 0 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .stamp { position: absolute; bottom: 16px; right: 40px; font-size: 10px; color: #5d594f; z-index: 2; }

  .tip { position: absolute; z-index: 5; pointer-events: none; min-width: 180px; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: rgba(22,17,4,.94); border: 1px solid rgba(245,179,1,.35); box-shadow: 0 8px 28px rgba(0,0,0,.5); display: none; }
  .tip .k { font-size: 9px; letter-spacing: .18em; color: var(--muted); }
  .tip .n { font-size: 12px; font-weight: 600; color: var(--cream); margin-top: 2px; }
  .tip .m { font-size: 10px; color: var(--muted); margin-top: 3px; }

  .panel { position: absolute; top: 120px; right: 24px; bottom: 56px; width: min(360px, calc(100% - 48px)); z-index: 6; background: rgba(12,10,4,.96); border: 1px solid rgba(245,179,1,.3); border-radius: 12px; padding: 16px 16px 12px; display: none; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  .panel.on { display: flex; }
  .panel .k { font-size: 10px; letter-spacing: .2em; color: var(--muted); }
  .panel h2 { margin: 4px 0 6px; font-size: 16px; line-height: 1.3; color: var(--cream); padding-right: 28px; }
  .panel .path { font-size: 10px; color: #9d988a; word-break: break-all; }
  .panel .pv { font-size: 12px; line-height: 1.55; color: #cbc6b8; margin: 10px 0; }
  .panel .x { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(240,236,224,.16); background: transparent; color: var(--muted); cursor: pointer; font: 14px var(--mono); }
  .open { display: inline-block; align-self: flex-start; margin: 4px 0 10px; padding: 6px 12px; border-radius: 6px; background: var(--gold); color: #1a1403; font: 600 12px var(--mono); text-decoration: none; }
  .nbh { font-size: 10px; letter-spacing: .16em; color: var(--muted); margin-top: 4px; }
  .nbl { overflow-y: auto; margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
  .nb { text-align: left; display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; border: 0; background: transparent; color: var(--cream); font: 12px var(--mono); cursor: pointer; }
  .nb:hover { background: rgba(245,179,1,.08); }
  .nb i { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .empty { position: absolute; inset: 0; display: none; place-items: center; text-align: center; color: var(--muted); font-size: 13px; z-index: 4; padding: 24px; }
  .empty code { color: var(--gold); }

  /* Ancho medio (p. ej. incrustado en Obsidian): la ayuda del subtítulo chocaría con los controles. */
  @media (max-width: 1700px) {
    .sub .hint { display: none; }
  }
  @media (max-width: 760px) {
    .stage { inset: 0; border: 0; }
    .controls { position: absolute; top: auto; bottom: 52px; right: 12px; left: 12px; align-items: stretch; }
    .row { justify-content: center; flex-wrap: wrap; }
    .search { width: 100%; }
    .stamp { display: none; }
    .sub .hint { display: none; }
    .panel { top: auto; right: 0; left: 0; bottom: 0; width: 100%; max-height: 62%; border-radius: 14px 14px 0 0; }
    .legend { bottom: 8px; font-size: 10px; gap: 4px 10px; }
  }
</style>

temario - Horario: [horario omitido]  - Profesor/a: pendiente · correo: pendiente - Enlace ","courses":["2"]},{"id":"2º ASIR/SASP - Sostenibilidad Aplicada al Sistema Productivo/Unidades/SASP UD01 - La sostenibilidad y ASG.md","name":"SASP UD01 - La sostenibilidad y ASG","kind":"ud","course":"2","degree":17,"orphan":false,"anchor":"MOC/MOC - SASP.md","preview":"La Sostenibilidad es satisfacer las necesidades del presente sin comprometer las de las generaciones futuras (Informe Brundtland, 1987) y exige equilibrar a la vez tres dimensiones: ambiental, social y económica. La Agenda 2030 (ONU, 2015) la ordena en 17 Obje","courses":["2"]},{"id":"2º ASIR/SRI - Servicios de Red e Internet/Ejercicios/Práctica - SSL en XAMPP.md","name":"Práctica - SSL en XAMPP","kind":"practica","course":"2","degree":14,"orphan":false,"anchor":"MOC/MOC - SRI.md","preview":"Justificante técnico (18/09/2026) de la configuración de HTTPS en el Servidor web Apache incluido en XAMPP para Windows: se sustituye el certificado de fábrica, caducado y sin SAN, por un certificado autofirmado propio generado con OpenSSL, se instala en Apach","courses":["2"]},{"id":"2º ASIR/SRI - Servicios de Red e Internet/Ficha - SRI.md","name":"Ficha - SRI","kind":"ficha","course":"2","degree":3,"orphan":false,"anchor":"MOC/MOC - SRI.md","preview":"- Módulo: Servicios de Red e Internet (2º ASIR, curso 2026-2027) - Modalidad: online - Horario: [horario omitido]  - Profesor/a: pendiente · correo: pendiente - Enlace a la asignatura: pendiente - Evaluación: pendiente - (todavía no hay u","courses":["2"]},{"id":"Biblioteca/Biblioteca.md","name":"Biblioteca","kind":"moc","course":"","degree":19,"orphan":false,"anchor":null,"preview":"Libros y documentos de consulta del ciclo, rescatados de la antigua copia de OneDrive. | Libro | Útil para | Conceptos | |---|---|---| | ASIR · Dossier del ciclo | Visión general del ciclo ASIR | Sector profesional informático | | Fundamentos de bases de datos","courses":["1","2"]},{"id":"Conceptos/Accesibilidad web.md","name":"Accesibilidad web","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"Práctica de diseñar y programar sitios web para que cualquier persona pueda usarlos, incluidas las personas con discapacidad (visual, auditiva, motora, cognitiva) y quienes usan tecnologías de apoyo como lectores de pantalla. Se rige por las pautas WCAG del W3","courses":["1"]},{"id":"Conceptos/ACL.md","name":"ACL","kind":"concepto","course":"","degree":28,"orphan":false,"anchor":null,"preview":"Access Control List. Lista ordenada de reglas permit/deny que el router o switch aplica al tráfico de una interfaz para permitirlo o bloquearlo según IP, protocolo y puerto.","courses":["1"]},{"id":"Conceptos/Active Directory.md","name":"Active Directory","kind":"concepto","course":"","degree":26,"orphan":false,"anchor":null,"preview":"Servicio de directorio de Microsoft (rol AD DS de Windows Server): base de datos jerárquica y centralizada de usuarios, grupos, equipos y recursos que permite autenticación única y administración centralizada del dominio.","courses":["1","2"]},{"id":"Conceptos/Almacenamiento HDD y SSD.md","name":"Almacenamiento HDD y SSD","kind":"concepto","course":"","degree":26,"orphan":false,"anchor":null,"preview":"Almacenamiento secundario no volátil que guarda de forma permanente lo que la RAM pierde al apagar. El HDD es mecánico (platos giratorios y cabezal); el SSD usa memoria flash NAND sin partes móviles y, en su versión NVMe, se comunica directamente por PCIe.","courses":["1"]},{"id":"Conceptos/Alta disponibilidad.md","name":"Alta disponibilidad","kind":"concepto","course":"","degree":31,"orphan":false,"anchor":null,"preview":"Capacidad de un sistema para seguir prestando servicio de forma continua aunque falle alguno de sus componentes. Se consigue eliminando puntos únicos de fallo mediante redundancia y conmutación automática (failover).","courses":["1","2"]},{"id":"Conceptos/Amazon EC2.md","name":"Amazon EC2","kind":"concepto","course":"","degree":24,"orphan":false,"anchor":null,"preview":"Elastic Compute Cloud, el servicio de AWS que ofrece servidores virtuales (instancias) bajo demanda. El cliente elige CPU, RAM, sistema operativo y red, y tiene control total sobre la máquina; es el ejemplo típico de IaaS.","courses":["1","2"]},{"id":"Conceptos/Amazon S3.md","name":"Amazon S3","kind":"concepto","course":"","degree":15,"orphan":false,"anchor":null,"preview":"Simple Storage Service, el servicio de almacenamiento de objetos de AWS. Guarda archivos de cualquier tamaño en contenedores llamados buckets, con altísima durabilidad y escalabilidad casi ilimitada, accesibles por web o API.","courses":["1"]},{"id":"Conceptos/ARP.md","name":"ARP","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Address Resolution Protocol. Protocolo que, dentro de una red local, averigua la Dirección MAC que corresponde a una dirección IPv4 conocida, para poder construir la trama Ethernet.","courses":["1"]},{"id":"Conceptos/Arquitectura ANSI-SPARC.md","name":"Arquitectura ANSI-SPARC","kind":"concepto","course":"","degree":10,"orphan":false,"anchor":null,"preview":"Arquitectura estándar de tres niveles de abstracción (externo, conceptual e interno) para los SGBD, cuyo objetivo es separar la visión de los usuarios del almacenamiento físico y lograr la independencia de datos.","courses":["1"]},{"id":"Conceptos/Arquitectura Von Neumann.md","name":"Arquitectura Von Neumann","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Modelo de ordenador propuesto por John von Neumann (1945) en el que instrucciones y datos comparten la misma memoria. Así la máquina cambia de tarea cargando otro programa, sin modificar el hardware. Casi todos los ordenadores actuales siguen este modelo.","courses":["1"]},{"id":"Conceptos/Auditoría y logs.md","name":"Auditoría y logs","kind":"concepto","course":"","degree":27,"orphan":false,"anchor":null,"preview":"Registro sistemático de los eventos de un sistema (qué pasó, quién y cuándo) y su revisión para diagnosticar fallos, detectar incidentes de seguridad y tener trazabilidad.","courses":["1","2"]},{"id":"Conceptos/Autenticación.md","name":"Autenticación","kind":"concepto","course":"","degree":34,"orphan":false,"anchor":null,"preview":"Proceso de comprobar que una identidad (usuario, equipo o servicio) es quien dice ser antes de darle acceso. Es distinta de la autorización, que decide qué puede hacer esa identidad una vez autenticada.","courses":["1","2"]},{"id":"Conceptos/AWS.md","name":"AWS","kind":"concepto","course":"","degree":27,"orphan":false,"anchor":null,"preview":"Amazon Web Services, el proveedor de nube pública pionero y líder del mercado. Ofrece cientos de servicios de cómputo, almacenamiento, red, bases de datos, IA y seguridad bajo pago por uso, desplegados sobre una infraestructura global de regiones y zonas de di","courses":["1","2"]},{"id":"Conceptos/Balanceo de carga.md","name":"Balanceo de carga","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Reparto de las peticiones entrantes entre varios servidores o instancias para que ninguno se sature, mejorar el rendimiento y seguir dando servicio si uno falla. Lo realiza un balanceador de carga, físico, software o gestionado en la nube.","courses":["1"]},{"id":"Conceptos/Base de datos.md","name":"Base de datos","kind":"concepto","course":"","degree":19,"orphan":false,"anchor":null,"preview":"Conjunto organizado de información estructurada y relacionada que permite almacenar, gestionar y recuperar datos de forma eficiente. Se crea y administra mediante un SGBD.","courses":["1","2"]},{"id":"Conceptos/Bases de datos NoSQL.md","name":"Bases de datos NoSQL","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Bases de datos no relacionales («Not only SQL») con esquema flexible, pensadas para grandes volúmenes de datos no estructurados o semiestructurados y para escalar horizontalmente en muchos servidores.","courses":["1"]},{"id":"Conceptos/Bash.md","name":"Bash","kind":"concepto","course":"","degree":16,"orphan":false,"anchor":null,"preview":"Intérprete de órdenes (shell) por defecto en la mayoría de distribuciones Linux; permite administrar el sistema desde la terminal y automatizar tareas con scripts .sh.","courses":["1","2"]},{"id":"Conceptos/BGP.md","name":"BGP","kind":"concepto","course":"","degree":10,"orphan":false,"anchor":null,"preview":"Border Gateway Protocol. Protocolo de enrutamiento exterior (EGP) que intercambia rutas entre sistemas autónomos (AS) y une las redes de los ISP que forman Internet. Decide por políticas y atributos, no por una métrica técnica.","courses":["1"]},{"id":"Conceptos/BIOS y UEFI.md","name":"BIOS y UEFI","kind":"concepto","course":"","degree":22,"orphan":false,"anchor":null,"preview":"Firmware de la placa base, grabado en un chip no volátil, que se ejecuta al encender: hace el POST, inicializa el hardware, busca un dispositivo de arranque y cede el control al gestor de arranque del sistema operativo. UEFI es la sucesora moderna de la BIOS c","courses":["1"]},{"id":"Conceptos/Bootstrap.md","name":"Bootstrap","kind":"concepto","course":"","degree":15,"orphan":false,"anchor":null,"preview":"Framework front-end (creado originalmente por Twitter; versión 5.3) que ofrece clases CSS predefinidas y componentes con JavaScript para construir sitios responsive, móvil primero, casi sin escribir CSS propio.","courses":["1"]},{"id":"Conceptos/Buses y puertos.md","name":"Buses y puertos","kind":"concepto","course":"","degree":16,"orphan":false,"anchor":null,"preview":"Un bus es el canal físico por el que viajan los datos entre los componentes del ordenador; un puerto es el punto de conexión (interno o externo) de un dispositivo. El protocolo es el \"idioma\" que se habla sobre ese camino.","courses":["1"]},{"id":"Conceptos/Búsqueda de empleo.md","name":"Búsqueda de empleo","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Proceso activo y estratégico de localizar oportunidades laborales y presentar la candidatura. Es en sí una competencia: combina varios canales con un perfil siempre actualizado.","courses":["1"]},{"id":"Conceptos/Cableado estructurado.md","name":"Cableado estructurado","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Sistema de cableado de un edificio diseñado según normas (ANSI/TIA/EIA-568, ISO/IEC 11801) para que sea ordenado, ampliable e independiente de los equipos que se conecten. Usa topología en estrella desde el rack hasta cada toma.","courses":["1"]},{"id":"Conceptos/CapEx y OpEx.md","name":"CapEx y OpEx","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"CapEx (capital expenditure) es la inversión inicial en activos que la empresa compra y posee (servidores, CPD); OpEx (operational expenditure) es el gasto operativo recurrente por consumir un servicio. Migrar a la nube convierte CapEx en OpEx.","courses":["2"]},{"id":"Conceptos/Catálogo Nacional de Cualificaciones Profesionales.md","name":"Catálogo Nacional de Cualificaciones Profesionales","kind":"concepto","course":"","degree":7,"orphan":false,"anchor":null,"preview":"Catálogo (CNCP) que recoge las cualificaciones profesionales del sistema español, entendidas como conjuntos de competencias necesarias para desempeñar una ocupación. Se consulta en incual.educacion.gob.es.","courses":["1"]},{"id":"Conceptos/CDN.md","name":"CDN","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Content Delivery Network, red de servidores distribuidos geográficamente que guardan en caché copias del contenido (imágenes, vídeo, web estática) para servirlo desde el punto más cercano al usuario, reduciendo la latencia y la carga del servidor de origen.","courses":["1","2"]},{"id":"Conceptos/Certificados SSL-TLS.md","name":"Certificados SSL-TLS","kind":"concepto","course":"","degree":18,"orphan":false,"anchor":null,"preview":"Documento digital (estándar X.509) que vincula una clave pública con una identidad (un dominio, una organización) y está firmado por una autoridad de certificación (CA). Permite a TLS (sucesor de SSL) autenticar al servidor y cifrar la comunicación, por ejempl","courses":["1","2"]},{"id":"Conceptos/Chipset.md","name":"Chipset","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Conjunto de circuitos de la placa base que actúa como \"controlador de tráfico\" entre la CPU, la memoria, las ranuras de expansión y los periféricos. Determina cuántos USB y SATA hay, qué versión de PCIe se admite y si se puede hacer overclocking o RAID.","courses":["1"]},{"id":"Conceptos/Cifrado simétrico y asimétrico.md","name":"Cifrado simétrico y asimétrico","kind":"concepto","course":"","degree":15,"orphan":false,"anchor":null,"preview":"Los dos grandes tipos de cifrado. El simétrico usa la misma clave para cifrar y descifrar; el asimétrico usa un par de claves matemáticamente ligadas: una pública, que se puede compartir, y una privada, que nunca sale de su dueño.","courses":["1","2"]},{"id":"Conceptos/Cisco IOS.md","name":"Cisco IOS","kind":"concepto","course":"","degree":24,"orphan":false,"anchor":null,"preview":"Sistema operativo de los routers y switches Cisco (Internetwork Operating System). Se administra por línea de comandos (CLI), por consola o de forma remota por SSH.","courses":["1"]},{"id":"Conceptos/Cisco Packet Tracer.md","name":"Cisco Packet Tracer","kind":"concepto","course":"","degree":24,"orphan":false,"anchor":null,"preview":"Simulador de redes educativo de Cisco con el que se diseñan topologías, se configuran routers, switches, puntos de acceso y servidores con una CLI tipo Cisco IOS y se observa el viaje de los paquetes. Es la herramienta de prácticas de Redes en 1º.","courses":["1"]},{"id":"Conceptos/Clave primaria y clave foránea.md","name":"Clave primaria y clave foránea","kind":"concepto","course":"","degree":18,"orphan":false,"anchor":null,"preview":"La clave primaria (PK) identifica de forma única cada fila de una tabla; la clave foránea (FK) es una columna que referencia la PK de otra tabla y así establece la relación entre ambas.","courses":["1"]},{"id":"Conceptos/Computación en la nube.md","name":"Computación en la nube","kind":"concepto","course":"","degree":32,"orphan":false,"anchor":null,"preview":"Acceso a recursos TI (servidores, almacenamiento, bases de datos, software) a través de internet y bajo demanda, pagando solo por lo que se usa. Sustituye el modelo on-premise, en el que la empresa compra y mantiene su propio hardware en su CPD.","courses":["1","2"]},{"id":"Conceptos/Contenedores.md","name":"Contenedores","kind":"concepto","course":"","degree":16,"orphan":false,"anchor":null,"preview":"Unidad ligera y portable que empaqueta una aplicación con sus bibliotecas, configuración y dependencias para que se ejecute igual en cualquier entorno. A diferencia de una máquina virtual, comparte el kernel del sistema anfitrión y se aísla a nivel de proceso.","courses":["1"]},{"id":"Conceptos/Contrato de trabajo.md","name":"Contrato de trabajo","kind":"concepto","course":"","degree":16,"orphan":false,"anchor":null,"preview":"Acuerdo por el que una persona presta servicios voluntarios, personales y retribuidos, por cuenta ajena y bajo la dirección del empresario. Es la base jurídica de la relación laboral; la realidad prevalece sobre la forma.","courses":["1"]},{"id":"Conceptos/Controlador de dominio.md","name":"Controlador de dominio","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Servidor que aloja una copia del directorio del dominio, autentica usuarios y equipos (Kerberos) y replica los cambios con los demás controladores. En Windows es un Windows Server con el rol AD DS promocionado.","courses":["2"]},{"id":"Conceptos/Convenio colectivo.md","name":"Convenio colectivo","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Acuerdo escrito entre representantes de los trabajadores (sindicatos) y de los empresarios (patronal) que regula las condiciones de trabajo de un ámbito determinado. Tiene fuerza vinculante (art. 37 CE): puede igualar o mejorar la ley, nunca empeorarla.","courses":["1"]},{"id":"Conceptos/Copias de seguridad.md","name":"Copias de seguridad","kind":"concepto","course":"","degree":50,"orphan":false,"anchor":null,"preview":"Duplicados de los datos (o de sistemas completos) guardados aparte para poder recuperarlos tras un fallo de hardware, un borrado, un ataque o un desastre. Una estrategia de backup define qué se copia, cómo, cada cuánto, dónde se guarda y cómo se comprueba la r","courses":["1","2"]},{"id":"Conceptos/CPD.md","name":"CPD","kind":"concepto","course":"","degree":37,"orphan":false,"anchor":null,"preview":"Centro de Procesamiento de Datos (data center): instalación que aloja servidores, almacenamiento y electrónica de red de una organización, diseñada para que todo sea redundante, eficiente y seguro. La \"nube\" son, en realidad, CPD de otras empresas.","courses":["1","2"]},{"id":"Conceptos/Criptografía.md","name":"Criptografía","kind":"concepto","course":"","degree":17,"orphan":false,"anchor":null,"preview":"Técnicas matemáticas para proteger la información transformándola de forma que solo la puedan leer o validar quienes poseen la clave adecuada. Garantiza confidencialidad (cifrado), integridad (hash) y autenticidad/no repudio (firma digital).","courses":["1","2"]},{"id":"Conceptos/Criterios ASG.md","name":"Criterios ASG","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Criterios Ambientales, Sociales y de Gobernanza (en inglés ESG, Environmental, Social and Governance) con los que se evalúa y compara la sostenibilidad de una empresa. Traducen la sostenibilidad al lenguaje del riesgo y del dato que usan inversores, bancos y g","courses":["2"]},{"id":"Conceptos/CSS Grid.md","name" os que el navegador construye a partir de un documento HTML (o XML), y la API estándar que permite leer y modificar su estructura, contenido y estilo desde JavaScript.","courses":["1"]},{"id":"Conceptos/Dominio.md","name":"Dominio","kind":"concepto","course":"","degree":13,"orphan":false,"anchor":null,"preview":"Agrupación lógica de usuarios, grupos y equipos que comparten un directorio (Active Directory) y una administración y seguridad centralizadas, frente al grupo de trabajo, donde cada equipo se gestiona por separado.","courses":["1","2"]},{"id":"Conceptos/DTD.md","name":"DTD","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"Document Type Definition: conjunto de reglas que define la estructura válida de un documento XML: qué elementos y atributos puede tener, en qué orden y cuántas veces.","courses":["1"]},{"id":"Conceptos/Economía circular.md","name":"Economía circular","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Modelo económico que busca mantener productos y materiales en uso el mayor tiempo posible (reducir, reutilizar, reparar, reacondicionar y reciclar) frente al modelo lineal de «extraer, fabricar, usar y tirar».","courses":["1","2"]},{"id":"Conceptos/Emmet.md","name":"Emmet","kind":"concepto","course":"","degree":8,"orphan":false,"anchor":null,"preview":"Herramienta de productividad integrada en editores como Visual Studio Code que expande abreviaturas tipo selector CSS en bloques completos de HTML (y CSS) al pulsar Tab.","courses":["1"]},{"id":"Conceptos/Empleabilidad.md","name":"Empleabilidad","kind":"concepto","course":"","degree":13,"orphan":false,"anchor":null,"preview":"Capacidad de mantenerse atractivo para el mercado laboral y de acceder de forma continuada a un empleo de calidad. No es encontrar un empleo puntual: la estabilidad viene de aprender y actualizarse.","courses":["1"]},{"id":"Conceptos/Empresa de trabajo temporal.md","name":"Empresa de trabajo temporal","kind":"concepto","course":"","degree":10,"orphan":false,"anchor":null,"preview":"Empresa (ETT) que contrata trabajadores para cederlos temporalmente a una empresa usuaria mediante un contrato de puesta a disposición. Es un intermediario legal del mercado de trabajo.","courses":["1"]},{"id":"Conceptos/Enlace troncal 802.1Q.md","name":"Enlace troncal 802.1Q","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Enlace (trunk) que transporta el tráfico de varias VLAN por un único cable entre switches, o entre switch y router. El estándar IEEE 802.1Q inserta en cada trama una etiqueta que indica a qué VLAN pertenece.","courses":["1"]},{"id":"Conceptos/Enrutamiento dinámico.md","name":"Enrutamiento dinámico","kind":"concepto","course":"","degree":10,"orphan":false,"anchor":null,"preview":"Los routers intercambian información mediante un protocolo de enrutamiento para aprender y actualizar las rutas automáticamente, y reconvergen solos cuando cae un enlace.","courses":["1"]},{"id":"Conceptos/Enrutamiento estático.md","name":"Enrutamiento estático","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Rutas que el administrador escribe a mano en la tabla de enrutamiento del router. Son estables y no consumen CPU ni ancho de banda, pero no se adaptan solas si un enlace cae.","courses":["1"]},{"id":"Conceptos/Ensamblado de un PC.md","name":"Ensamblado de un PC","kind":"concepto","course":"","degree":13,"orphan":false,"anchor":null,"preview":"Procedimiento ordenado y seguro para montar un ordenador a partir de sus componentes, protegiendo al técnico y a las piezas (sobre todo frente a la descarga electrostática, ESD) y verificando el funcionamiento antes de cerrar la caja.","courses":["1"]},{"id":"Conceptos/Ergonomía.md","name":"Ergonomía","kind":"concepto","course":"","degree":10,"orphan":false,"anchor":null,"preview":"Disciplina preventiva que adapta el trabajo a la persona (y no al revés) para evitar trastornos musculoesqueléti ral de AWS que define quién puede hacer qué, desde dónde y sobre qué recursos. Gestiona identidades (usuarios, grupos, roles) y sus permisos mediante políticas en JSON.","courses":["1"]},{"id":"Conceptos/ICMP.md","name":"ICMP","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Internet Control Message Protocol. Protocolo auxiliar de la capa de red (Internet) que transporta mensajes de error y de diagnóstico entre equipos IP. Es la base de ping y traceroute.","courses":["1"]},{"id":"Conceptos/Integridad referencial.md","name":"Integridad referencial","kind":"concepto","course":"","degree":20,"orphan":false,"anchor":null,"preview":"Restricción del Modelo relacional que garantiza que todo valor de una clave foránea coincide con una clave primaria existente en la tabla referenciada (o es NULL si se permite), evitando registros huérfanos.","courses":["1"]},{"id":"Conceptos/IPv6.md","name":"IPv6","kind":"concepto","course":"","degree":13,"orphan":false,"anchor":null,"preview":"Versión 6 del protocolo IP, con direcciones de 128 bits (2¹²⁸ direcciones) escritas en 8 grupos de 4 dígitos hexadecimales. Nace para resolver el agotamiento de IPv4 y, en teoría, elimina la necesidad de NAT.","courses":["1"]},{"id":"Conceptos/JavaScript.md","name":"JavaScript","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Lenguaje de script interpretado, ligero y de tipado dinámico, creado por Netscape (1995) y estandarizado como ECMAScript, que da interactividad a las páginas web manipulando el DOM. También se ejecuta en servidor con Node.js.","courses":["1"]},{"id":"Conceptos/Jornada laboral.md","name":"Jornada laboral","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Tiempo que el trabajador dedica al trabajo efectivo. El Estatuto de los Trabajadores (art. 34) fija sus límites mínimos de protección, que el convenio colectivo puede mejorar.","courses":["1"]},{"id":"Conceptos/JSON.md","name":"JSON", de toda la vida: el título no basta para toda la carrera, hay que seguir formándose. Es la base de la empleabilidad.","courses":["1"]},{"id":"Conceptos/Linux.md","name":"Linux","kind":"concepto","course":"","degree":41,"orphan":false,"anchor":null,"preview":"Kernel libre (GPL) creado por Linus Torvalds que, junto con herramientas GNU y otros componentes, forma las distribuciones Linux (Ubuntu, Debian, RHEL, Rocky…), dominantes en servidores y en la nube.","courses":["1","2"]},{"id":"Conceptos/LVM.md","name":"LVM","kind":"concepto","course":"","degree":10,"orphan":false,"anchor":null,"preview":"Logical Volume Manager, capa de Linux que abstrae los discos físicos en un \"pool\" de espacio del que se crean volúmenes lógicos redimensionables. No es un sistema de archivos, es un gestor de espacio.","courses":["1"]},{"id":"Conceptos/Malware.md","name":"Malware","kind":"concepto","course":"","degree":15,"orphan":false,"anchor":null,"preview":"Software malicioso diseñado para dañar un sistema, robar información, tomar el control del equipo o extorsionar a su dueño. Es una de las principales amenazas de la seguridad informática.","courses":["1"]},{"id":"Conceptos/Mantenimiento preventivo.md","name":"Mantenimiento preventivo","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Conjunto de tareas periódicas que se hacen sobre un equipo antes de que falle, para alargar su vida útil y evitar averías y tiempos de inactividad.","courses":["1"]},{"id":"Conceptos/Markdown.md","name":"Markdown","kind":"concepto","course":"","degree":8,"orphan":false,"anchor":null,"preview":"Lenguaje de marcas ligero que usa símbolos de texto plano (, , -) en lugar de etiquetas para dar formato. Se lee bien sin procesar y se convierte fácilmente a HTML.","courses":["1"]},{"id":"Conceptos/Medios de transmisión.md","name":"Medios de transmisión","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Soporte físico por el que viaja la señal en una red. Pueden ser guiados (cable de cobre o fibra óptica) o no guiados (ondas de radio: Wi-Fi, 4G/5G, satélite).","courses":["1"]},{"id":"Conceptos/Memoria RAM.md","name":"Memoria RAM","kind":"concepto","course":"","degree":20,"orphan":false,"anchor":null,"preview":"Memoria principal del ordenador, de acceso aleatorio y volátil (se borra al apagar). Es el espacio de trabajo donde el sistema operativo carga desde el disco los programas y datos que usa la CPU. La tecnología actual es SDRAM de tipo DDR.","courses":["1"]},{"id":"Conceptos/Microprocesador.md","name":"Microprocesador","kind":"concepto","course":"","degree":17,"orphan":false,"anchor":null,"preview":"La CPU, el \"cerebro\" del ordenador: ejecuta sin parar el ciclo de instrucción fetch → decode → execute sobre instrucciones y datos traídos de la memoria. Es la pieza central de la arquitectura Von Neumann.","courses":["1"]},{"id":"Conceptos/Modelo de responsabilidad compartida.md","name":"Modelo de responsabilidad compartida","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Reparto de la seguridad entre el proveedor de nube y el cliente. El proveedor protege la seguridad de la nube (CPD, hardware, red global, hipervisor) y el cliente la seguridad en la nube (identidades, configuración, datos, cifrado y código).","courses":["1"]},{"id":"Conceptos/Modelo Entidad-Relación.md","name":"Modelo Entidad-Relación","kind":"concepto","course":"","degree":18,"orphan":false,"anchor":null,"preview":"Modelo de diseño conceptual de una base de datos (Peter Chen, 1976) que representa el mundo real mediante entidades, atributos y relaciones con sus cardinalidades. Después se traduce al modelo relacional (tablas, claves primarias y foráneas) y se normaliza.","courses":["1"]},{"id":"Conceptos/Modelo OSI.md","name":"Modelo OSI","kind":"concepto","course":"","degree":18,"orphan":false,"anchor":null,"preview":"Modelo de referencia de 7 capas (física, enlace, red, transporte, sesión, presentación y aplicación) que describe cómo se comunican los sistemas en red y en qué capa actúa cada protocolo y dispositivo. Su valor es didáctico y de diagnóstico.","courses":["1"]},{"id":"Conceptos/Modelo relacional.md","name":"Modelo relacional","kind":"concepto","course":"","degree":22,"orphan":false,"anchor":null,"preview":"Modelo lógico de datos propuesto por Edgar F. Codd en el que la información se organiza en tablas (relaciones) formadas por filas (tuplas) y columnas (atributos), unidas entre sí mediante claves.","courses":["1"]},{"id":"Conceptos/Modelo TCP-IP.md","name":"Modelo TCP-IP","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Modelo de comunicaciones de 4 capas en el que se basa realmente Internet. Agrupa las 7 capas del Modelo OSI en cuatro y toma su nombre de sus dos protocolos principales: TCP (transporte) e IP (red).","courses":["1"]},{"id":"Conceptos/Modelos de despliegue en la nube.md","name":"Modelos de despliegue en la nube","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"Clasificación de la nube según dónde está la infraestructura y quién puede usarla: pública, privada, híbrida (y multinube). Es independiente del modelo de servicio (IaaS, PaaS, SaaS).","courses":["1"]},{"id":"Conceptos/Modelos de servicio IaaS, PaaS y SaaS.md","name":"Modelos de servicio IaaS, PaaS y SaaS","kind":"concepto","course":"","degree":16,"orphan":false,"anchor":null,"preview":"Las tres formas de contratar servicios en la nube, que se diferencian por qué capas gestiona el proveedor y cuáles el cliente. Cuanto más gestionado es el modelo, menos trabajo y responsabilidad para el cliente, pero también menos control.","courses":["1","2"]},{"id":"Conceptos/Modificación, suspensión y extinción del contrato.md","name":"Modificación, suspensión y extinción del contrato","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Vicisitudes de la relación laboral reguladas en los arts. 40-54 del Estatuto de los Trabajadores: la relación puede cambiar (modificación, movilidad), congelarse (suspensión, excedencia) o terminar (extinción), y la causa determina los derechos del trabajador.","courses":["1"]},{"id":"Conceptos/Monitorización del rendimiento.md","name":"Monitorización del rendimiento","kind":"concepto","course":"","degree":20,"orphan":false,"anchor":null,"preview":"Observación de las métricas de un sistema (CPU, RAM, disco, red, servicios) para saber qué pasa ahora, si es normal y si hay indicios de un problema que va a escalar.","courses":["1"]},{"id":"Conceptos/MySQL.md","name":"MySQL","kind":"concepto","course":"","degree":25,"orphan":false,"anchor":null,"preview":"Sistema gestor de bases de datos relacional de código abierto (propiedad de Oracle), muy usado en aplicaciones web; es el SGBD con el que se practica SQL en el curso, junto con la herramienta MySQL Workbench.","courses":["1"]},{"id":"Conceptos/Máquina virtual.md","name":"Máquina virtual","kind":"concepto","course":"","degree":25,"orphan":false,"anchor":null,"preview":"Equipo emulado por software (CPU, RAM, disco, red virtuales) que ejecuta su propio sistema operativo invitado sobre un hipervisor, aislado del anfitrión y de otras VM.","courses":["1","2"]},{"id":"Conceptos/NAS y SAN.md","name":"NAS y SAN","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Dos formas de almacenamiento en red. Un NAS (Network Attached Storage) es un servidor de archivos conectado a la LAN por Ethernet que comparte carpetas; una SAN (Storage Area Network) es una red dedicada de almacenamiento que ofrece a los servidores discos \"en","courses":["1"]},{"id":"Conceptos/NAT.md","name":"NAT","kind":"concepto","course":"","degree":22,"orphan":false,"anchor":null,"preview":"Network Address Translation. El router sustituye la IP privada de los paquetes por una IP pública al salir a Internet y deshace la traducción al volver, lo que permite que muchos equipos compartan pocas (o una sola) direcciones públicas IPv4.","courses":["1"]},{"id":"Conceptos/Normalización.md","name":"Normalización","kind":"concepto","course":"","degree":18,"orphan":false,"anchor":null,"preview":"Proceso de diseño lógico que descompone las tablas del Modelo relacional siguiendo unas formas normales para eliminar redundancias y evitar anomalías de inserción, actualización y borrado.","courses":["1"]},{"id":"Conceptos/Objetivos de Desarrollo Sostenible.md","name":"Objetivos de Desarrollo Sostenible","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"Los 17 objetivos (ODS) de la Agenda 2030, aprobada por la Asamblea General de la ONU en septiembre de 2015, con 169 metas e indicadores de seguimiento. Su principio rector es «no dejar a nadie atrás».","courses":["2"]},{"id":"Conceptos/Objetivos SMART.md","name":"Objetivos SMART","kind":"concepto","course":"","degree":7,"orphan":false,"anchor":null,"preview":"Método para formular metas profesionales concretas y comprobables: cada objetivo debe ser específico, medible, alcanzable, relevante y con plazo.","courses":["1"]},{"id":"Conceptos/OSPF.md","name":"OSPF","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Open Shortest Path First (RFC 2328). Protocolo de enrutamiento dinámico interior de estado de enlace: cada router conoce el mapa completo de la red y calcula el camino más corto con el algoritmo de Dijkstra (SPF).","courses":["1"]},{"id":"Conceptos/Particionado MBR y GPT.md","name":"Particionado MBR y GPT","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Dos esquemas para guardar la tabla de particiones de un disco. MBR es el clásico ligado a BIOS; GPT es el moderno ligado a UEFI.","courses":["1"]},{"id":"Conceptos/Periféricos.md","name":"Periféricos","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Dispositivos externos a la unidad central que forman el subsistema de entrada/salida: permiten introducir datos, mostrar resultados, comunicarse o almacenar información. Cada uno necesita su controladora y su driver.","courses":["1"]},{"id":"Conceptos/Permisos.md","name":"Permisos","kind":"concepto","course":"","degree":27,"orphan":false,"anchor":null,"preview":"Reglas que determinan qué puede hacer cada usuario o grupo sobre un recurso (archivo, carpeta, recurso compartido, servicio). La autenticación dice quién eres; los permisos, qué puedes hacer.","courses":["1","2"]},{"id":"Conceptos/PL-SQL.md","name":"PL-SQL","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"PL/SQL (Procedural Language/SQL) es la extensión procedimental de SQL de Oracle: añade variables, estructuras de control, manejo de excepciones y subprogramas. Extiende SQL, no lo sustituye.","courses":["1"]},{"id":"Conceptos/Placa base.md","name":"Placa base","kind":"concepto","course":"","degree":18,"orphan":false,"anchor":null,"preview":"Placa de circuito impreso (PCB, de 6 a 12 capas de pistas de cobre) que interconecta y alimenta todos los componentes del PC. Aloja el zócalo de la CPU, las ranuras de memoria y expansión, el chipset, el firmware (BIOS/UEFI) y los buses: es el esqueleto y el s","courses":["1"]},{"id":"Conceptos/Plan de emergencia.md","name":"Plan de emergencia","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"Documento vivo que establece quién hace qué, con qué medios y en qué orden ante incendios, fugas, explosiones o accidentes graves. Lo exigen la LPRL y el RD 393/2007 (autoprotección).","courses":["1"]},{"id":"Conceptos/PowerShell.md","name":"PowerShell","kind":"concepto","course":"","degree":20,"orphan":false,"anchor":null,"preview":"Shell y lenguaje de scripting de Microsoft orientado a objetos (.NET). Es la herramienta principal para administrar y automatizar Windows y Windows Server.","courses":["1","2"]},{"id":"Conceptos/Prevención de riesgos laborales.md","name":"Prevención de riesgos laborales","kind":"concepto","course":"","degree":15,"orphan":false,"anchor":null,"preview":"Conjunto de actividades y medidas adoptadas en todas las fases de la actividad de la empresa para evitar o reducir los riesgos derivados del trabajo. En España se regula por la Ley 31/1995 (LPRL).","courses":["1"]},{"id":"Conceptos/Primeros auxilios.md","name":"Primeros auxilios","kind":"concepto","course":"","degree":8,"orphan":false,"anchor":null,"preview":"Acciones inmediatas que se prestan a una persona accidentada o enferma hasta que llega la asistencia profesional. Buscan preservar la vida, evitar complicaciones y aliviar el dolor.","courses":["1"]},{"id":"Conceptos/Procedimientos y funciones almacenadas.md","name":"Procedimientos y funciones almacenadas","kind":"concepto","course":"","degree":13,"orphan":false,"anchor":null,"preview":"Bloques de código SQL/procedimental guardados en el servidor de BD con un nombre, reutilizables y con parámetros. El procedimiento realiza una acción; la función siempre devuelve un valor.","courses":["1"]},{"id":"Conceptos/Proceso de arranque.md","name":"Proceso de arranque","kind":"concepto","course":"","degree":20,"orphan":false,"anchor":null,"preview":"Secuencia que va desde el encendido hasta que el sistema operativo toma el control: firmware → esquema de particiones → gestor de arranque (bootloader) → kernel → servicios.","courses":["1"]},{"id":"Conceptos/Programación de tareas.md","name":"Programación de tareas","kind":"concepto","course":"","degree":20,"orphan":false,"anchor":null,"preview":"Mecanismo del sistema operativo para ejecutar órdenes o scripts de forma automática en un momento o con una periodicidad determinada (backups, limpiezas, informes).","courses":["1"]},{"id":"Conceptos/Puertos y protocolos.md","name":"Puertos y protocolos","kind":"concepto","course":"","degree":27,"orphan":false,"anchor":null,"preview":"Un puerto es un número de 16 bits (0-65535) que, junto a la IP, identifica qué aplicación o servicio recibe los datos en un equipo. Cada protocolo de aplicación tiene asociado un puerto conocido sobre TCP o UDP.","courses":["1","2"]},{"id":"Conceptos/QoS.md","name":"QoS","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"Quality of Service. Conjunto de mecanismos que clasifican y priorizan el tráfico sensible (voz, vídeo, aplicaciones críticas) para garantizarle ancho de banda y controlar la latencia, la pérdida de paquetes y el jitter.","courses":["1"]},{"id":"Conceptos/RAID.md","name":"RAID","kind":"concepto","course":"","degree":22,"orphan":false,"anchor":null,"preview":"Redundant Array of Independent Disks: método que combina varios discos físicos en una única unidad lógica para ganar redundancia (tolerancia a fallos), rendimiento o ambas cosas. No es un dispositivo, sino una forma de organizar los datos; puede hacerse por ha","courses":["1"]},{"id":"Conceptos/Redes inalámbricas Wi-Fi.md","name":"Redes inalámbricas Wi-Fi","kind":"concepto","course":"","degree":15,"orphan":false,"anchor":null,"preview":"Redes de área local que usan ondas de radio (medio no guiado) según la familia de estándares IEEE 802.11. Un punto de acceso (AP) conecta los clientes inalámbricos con la red cableada.","courses":["1"]},{"id":"Conceptos/Redes LAN, MAN y WAN.md","name":"Redes LAN, MAN y WAN","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Clasificación de las redes según su alcance geográfico: local (LAN), metropolitana (MAN) y de área extensa (WAN). Internet es la WAN más grande.","courses":["1","2"]},{"id":"Conceptos/Regiones y zonas de disponibilidad.md","name":"Regiones y zonas de disponibilidad","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Jerarquía física de la infraestructura global de la nube. Una región es un área geográfica con varios centros de datos; cada zona de disponibilidad (AZ) es un centro de datos independiente dentro de la región, con energía, refrigeración y red propias.","courses":["1","2"]},{"id":"Conceptos/Relación laboral.md","name":"Relación laboral","kind":"concepto","course":"","degree":13,"orphan":false,"anchor":null,"preview":"Prestación voluntaria de servicios retribuidos por cuenta ajena y bajo la dirección de otra persona, física o jurídica (art. 1 del Estatuto de los Trabajadores).","courses":["1"]},{"id":"Conceptos/Resolución de incidencias.md","name":"Resolución de incidencias","kind":"concepto","course":"","degree":19,"orphan":false,"anchor":null,"preview":"Proceso ordenado para detectar, diagnosticar, resolver y documentar los problemas de un sistema (troubleshooting), de forma trazable y sin actuar a ciegas.","courses":["1"]},{"id":"Conceptos/Responsabilidad social corporativa.md","name":"Responsabilidad social corporativa","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"Asunción voluntaria por parte de una empresa de compromisos sociales y ambientales que van más allá de lo que exige la ley. Históricamente se ha concretado en acciones puntuales (patrocinios, voluntariado, donar equipos retirados).","courses":["2"]},{"id":"Conceptos/Riesgos laborales.md","name":"Riesgos laborales","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Posibilidad de que un trabajador sufra un daño derivado del trabajo. Surgen de condiciones físicas, químicas, biológicas y organizativas presentes en cualquier entorno laboral.","courses":["1"]},{"id":"Conceptos/Riesgos psicosociales.md","name":"Riesgos psicosociales","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"Según el INSST, aspectos del diseño, la organización y la gestión del trabajo y de su contexto social que pueden causar daño físico, psicológico o social al trabajador.","courses":["1"]},{"id":"Conceptos/RIP.md","name":"RIP","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Routing Information Protocol. Protocolo de enrutamiento dinámico interior de tipo vector distancia (algoritmo Bellman-Ford) que elige la ruta con menos saltos. Sencillo, pero lento y limitado a redes pequeñas.","courses":["1"]},{"id":"Conceptos/Router.md","name":"Router","kind":"concepto","course":"","degree":38,"orphan":false,"anchor":null,"preview":"Dispositivo de capa 3 que interconecta redes distintas y decide, con su tabla de enrutamiento, el mejor camino para cada paquete IP. Es el único que separa dominios de broadcast.","courses":["1"]},{"id":"Conceptos/SAI.md","name":"SAI","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Sistema de Alimentación Ininterrumpida (UPS en inglés): equipo con baterías que mantiene la corriente a los dispositivos durante un corte o una anomalía eléctrica, evitando apagados bruscos y dando tiempo a un apagado ordenado o a que arranquen los generadores","courses":["1"]},{"id":"Conceptos/Salario y nómina.md","name":"Salario y nómina","kind":"concepto","course":"","degree":13,"orphan":false,"anchor":null,"preview":"El salario (art. 26 ET) es la retribución, en dinero o especie, por el trabajo y por los descansos computables; nunca inferior al SMI. La nómina es el recibo que lo documenta: devengos menos deducciones = líquido a percibir.","courses":["1"]},{"id":"Conceptos/Salud laboral.md","name":"Salud laboral","kind":"concepto","course":"","degree":13,"orphan":false,"anchor":null,"preview":"Estado completo de bienestar físico, mental y social en el trabajo (definición de la OMS), no solo la ausencia de accidentes o enfermedades. Un trabajador \"sano\" médicamente puede sufrir estrés, aislamiento o falta de reconocimiento.","courses":["1"]},{"id":"Conceptos/Sector profesional informático.md","name":"Sector profesional informático","kind":"concepto","course":"","degree":18,"orphan":false,"anchor":null,"preview":"Parte del sector cuaternario (conocimiento, tecnología e información: informática, telecomunicaciones, I+D+i, análisis de datos). Está en expansión y ofrece alta empleabilidad a jóvenes cualificados.","courses":["1"]},{"id":"Conceptos/Seguridad inalámbrica WPA.md","name":"Seguridad inalámbrica WPA","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Familia de protocolos de seguridad Wi-Fi (Wi-Fi Protected Access) que cifran el tráfico inalámbrico y controlan quién se conecta al punto de acceso. Sustituyó al inseguro WEP.","courses":["1"]},{"id":"Conceptos/Seguridad informática.md","name":"Seguridad informática","kind":"concepto","course":"","degree":43,"orphan":false,"anchor":null,"preview":"Conjunto de medidas técnicas, organizativas y legales para proteger los sistemas y la información frente a accesos no autorizados, alteraciones, pérdidas o interrupciones. Se resume en la tríada CIA: confidencialidad, integridad y disponibilidad.","courses":["1","2"]},{"id":"Conceptos/Seguridad Social.md","name":"Seguridad Social","kind":"concepto","course":"","degree":13,"orphan":false,"anchor":null,"preview":"Sistema público que protege frente a enfermedad, vejez, desempleo, maternidad, incapacidad o falta de ingresos: cada uno aporta según su capacidad y recibe según su necesidad.","courses":["1"]},{"id":"Conceptos/SEO.md","name":"SEO","kind":"concepto","course":"","degree":8,"orphan":false,"anchor":null,"preview":"Search Engine Optimization: conjunto de técnicas para mejorar la posición de una web en los resultados orgánicos de los buscadores, facilitando que la rastreen, la entiendan y la consideren relevante.","courses":["1"]},{"id":"Conceptos/Serverless.md","name":"Serverless","kind":"concepto","course":"","degree":15,"orphan":false,"anchor":null,"preview":"Modelo de ejecución en la nube en el que el proveedor gestiona por completo los servidores y el cliente solo sube su código, que se ejecuta ante eventos y se paga por tiempo de ejecución. También se llama FaaS (Function as a Service); en AWS, AWS Lambda.","courses":["1","2"]},{"id":"Conceptos/Servicios del sistema.md","name":"Servicios del sistema","kind":"concepto","course":"","degree":19,"orphan":false,"anchor":null,"preview":"Programas que se ejecutan en segundo plano, normalmente desde el arranque y sin interacción del usuario, para ofrecer funciones al sistema o a la red (SSH, web, DNS, impresión…). En Linux se llaman demonios (daemons).","courses":["1"]},{"id":"Conceptos/Servidor web.md","name":"Servidor web","kind":"concepto","course":"","degree":30,"orphan":false,"anchor":null,"preview":"Software (y por extensión la máquina que lo ejecuta) que atiende peticiones HTTP y HTTPS de los clientes (navegadores) y les devuelve recursos: páginas HTML, hojas CSS, scripts, imágenes o contenido generado dinámicamente.","courses":["1","2"]},{"id":"Conceptos/Señalización de seguridad.md","name":"Señalización de seguridad","kind":"concepto","course":"","degree":8,"orphan":false,"anchor":null,"preview":"Sistema normalizado de señales y colores que informa de prohibiciones, obligaciones, peligros, salidas y equipos de emergencia. Es una medida preventiva y uno de los pilares del plan de emergencia.","courses":["1"]},{"id":"Conceptos/SGBD.md","name":"SGBD","kind":"concepto","course":"","degree":21,"orphan":false,"anchor":null,"preview":"Sistema Gestor de Bases de Datos: software que permite crear, administrar, consultar y proteger una Base de datos, actuando de intermediario entre los datos y los usuarios o aplicaciones.","courses":["1"]},{"id":"Conceptos/Sistema operativo.md","name":"Sistema operativo","kind":"concepto","course":"","degree":20,"orphan":false,"anchor":null,"preview":"Software base que gestiona el hardware (CPU, RAM, discos, E/S) y ofrece servicios a las aplicaciones y al usuario. Es el \"director de orquesta\" del equipo, no solo su interfaz gráfica.","courses":["1"]},{"id":"Conceptos/Sistemas de archivos.md","name":"Sistemas de archivos","kind":"concepto","course":"","degree":16,"orphan":false,"anchor":null,"preview":"Estructura con la que el sistema operativo organiza, nombra, guarda y recupera los datos en una partición o volumen (las \"estanterías y etiquetas\" del disco).","courses":["1"]},{"id":"Conceptos/Sostenibilidad.md","name":"Sostenibilidad","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Capacidad de satisfacer las necesidades del presente sin comprometer las de las generaciones futuras (Informe Brundtland, Nuestro futuro común, ONU, 1987). Exige equilibrar a la vez tres dimensiones: ambiental, social y económica.","courses":["2"]},{"id":"Conceptos/SQL - DCL.md","name":"SQL - DCL","kind":"concepto","course":"","degree":9,"orphan":false,"anchor":null,"preview":"Data Control Language, parte de SQL que controla quién puede acceder a qué datos y qué operaciones puede hacer, concediendo y retirando privilegios.","courses":["1"]},{"id":"Conceptos/SQL - DDL.md","name":"SQL - DDL","kind":"concepto","course":"","degree":19,"orphan":false,"anchor":null,"preview":"Data Definition Language, parte de SQL que crea, modifica y elimina la estructura de la base de datos: bases, tablas, tipos de datos, restricciones, Índices y Vistas.","courses":["1"]},{"id":"Conceptos/SQL - DML.md","name":"SQL - DML","kind":"concepto","course":"","degree":18,"orphan":false,"anchor":null,"preview":"Data Manipulation Language, parte de SQL que inserta, modifica y elimina los datos (filas) de las tablas ya creadas con el DDL.","courses":["1"]},{"id":"Conceptos/SQL - DQL.md","name":"SQL - DQL","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Data Query Language, parte de SQL dedicada a consultar datos mediante la sentencia SELECT, sin modificarlos.","courses":["1"]},{"id":"Conceptos/SQL - JOIN.md","name":"SQL - JOIN","kind":"concepto","course":"","degree":21,"orphan":false,"anchor":null,"preview":"Operación de consulta que combina filas de dos o más tablas a partir de una condición, normalmente clave primaria = clave foránea. INNER devuelve solo las coincidencias; LEFT/RIGHT conservan todas las filas de un lado.","courses":["1"]},{"id":"Conceptos/SQL.md","name":"SQL","kind":"concepto","course":"","degree":21,"orphan":false,"anchor":null,"preview":"Structured Query Language, lenguaje estándar declarativo para definir, manipular, consultar y controlar datos en bases de datos relacionales. Se indica qué se quiere, no cómo obtenerlo.","courses":["1"]},{"id":"Conceptos/SSH.md","name":"SSH","kind":"concepto","course":"","degree":29,"orphan":false,"anchor":null,"preview":"Secure Shell, protocolo cifrado (TCP 22) para administrar equipos remotamente en modo texto, transferir archivos y crear túneles. Sustituye a Telnet, que enviaba todo en claro.","courses":["1"]},{"id":"Conceptos/STP.md","name":"STP","kind":"concepto","course":"","degree":12,"orphan":false,"anchor":null,"preview":"Spanning Tree Protocol (IEEE 802.1D). Protocolo de capa 2 que evita los bucles y las tormentas de broadcast en topologías con enlaces redundantes entre switches, bloqueando lógicamente los caminos sobrantes y reactivándolos si falla el principal.","courses":["1"]},{"id":"Conceptos/Subconsultas.md","name":"Subconsultas","kind":"concepto","course":"","degree":10,"orphan":false,"anchor":null,"preview":"Consulta SELECT anidada dentro de otra sentencia SQL que le aporta un resultado intermedio (un valor, una lista o una tabla).","courses":["1"]},{"id":"Conceptos/Subnetting y máscaras de red.md","name":"Subnetting y máscaras de red","kind":"concepto","course":"","degree":26,"orphan":false,"anchor":null,"preview":"Dividir una red IPv4 en subredes más pequeñas tomando bits de la parte de host y ajustando la máscara (notación CIDR /n). Permite calcular la dirección de red, el broadcast, el rango de hosts y el número de subredes.","courses":["1"]},{"id":"Conceptos/Switch.md","name":"Switch","kind":"concepto","course":"","degree":27,"orphan":false,"anchor":null,"preview":"Conmutador de capa 2 que interconecta los equipos de una LAN y reenvía cada trama solo por el puerto donde está la Dirección MAC de destino. Sustituyó al hub, que repetía la señal por todos los a, y agrupaciones de cuentas que permiten asignar permisos de forma colectiva en lugar de uno a uno.","courses":["1","2"]},{"id":"Conceptos/Usuarios y privilegios en BD.md","name":"Usuarios y privilegios en BD","kind":"concepto","course":"","degree":20,"orphan":false,"anchor":null,"preview":"Mecanismo de seguridad del SGBD que identifica a cada persona o aplicación con una cuenta de usuario y le asigna, directamente o mediante roles, los privilegios exactos sobre bases, tablas, vistas o procedimientos.","courses":["1"]},{"id":"Conceptos/Virtualización.md","name":"Virtualización","kind":"concepto","course":"","degree":31,"orphan":false,"anchor":null,"preview":"Ejecutar varios sistemas operativos o servicios sobre máquinas virtuales o contenedores que comparten un mismo hardware físico, en lugar de usar hardware dedicado. Es la base de los laboratorios de ISO/ASO y de la computación en la nube.","courses":["1","2"]},{"id":"Conceptos/Vistas.md","name":"Vistas","kind":"concepto","course":"","degree":15,"orphan":false,"anchor":null,"preview":"Una vista (VIEW) es una tabla virtual definida por una consulta; no almacena datos, sino la consulta, que se ejecuta cada vez sobre las tablas reales.","courses":["1"]},{"id":"Conceptos/VLAN.md","name":"VLAN","kind":"concepto","course":"","degree":37,"orphan":false,"anchor":null,"preview":"Red local virtual: segmenta un switch en varias redes lógicas independientes (IEEE 802.1Q), agrupando equipos por función y no por ubicación. Cada VLAN es un dominio de broadcast propio; para que dos VLAN se comuniquen hace falta enrutamiento (router-on-a-stic","courses":["1"]},{"id":"Conceptos/VLSM.md","name":"VLSM","kind":"concepto","course":"","degree":17,"orphan":false,"anchor":null,"preview":"Variable Length Subnet Mask. Técnica de subnetting que asigna máscaras de distinta longitud dentro de una misma red base, para dar a cada segmento exactamente el tamaño que necesita y no desperdiciar direcciones.","courses":["1"]},{"id":"Conceptos/VPC.md","name":"VPC","kind":"concepto","course":"","degree":20,"orphan":false,"anchor":null,"preview":"Virtual Private Cloud, red privada virtual y aislada dentro de la nube de AWS sobre la que se construye toda arquitectura. El cliente define su rango de IP, subredes, tablas de rutas y reglas de filtrado, como en un centro de datos propio pero sin hardware.","courses":["1","2"]},{"id":"Conceptos/VPN.md","name":"VPN","kind":"concepto","course":"","degree":14,"orphan":false,"anchor":null,"preview":"Red privada virtual: crea un túnel cifrado sobre una red pública (Internet) para que un usuario remoto o una sede se conecten a la red de la empresa como si estuvieran dentro de ella.","courses":["1"]},{"id":"Conceptos/VTP.md","name":"VTP","kind":"concepto","course":"","degree":8,"orphan":false,"anchor":null,"preview":"VLAN Trunking Protocol, protocolo propietario de Cisco que sincroniza la base de datos de VLAN (vlan.dat) entre los switches de un mismo dominio a través de los enlaces troncales, para no tener que crear las VLAN a mano en cada uno.","courses":["1"]},{"id":"Conceptos/Well-Architected Framework.md","name":"Well-Architected Framework","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"Marco de buenas prácticas de AWS para diseñar y evaluar arquitecturas en la nube seguras, fiables, eficientes y rentables. Se organiza en seis pilares y un conjunto de principios de diseño.","courses":["2"]},{"id":"Conceptos/Windows Server.md","name":"Windows Server","kind":"concepto","course":"","degree":25,"orphan":false,"anchor":null,"preview":"Sistema operativo de servidor de Microsoft que ofrece servicios centralizados a la red mediante roles (AD DS, DNS, DHCP, archivos, impresión, Hyper-V, WDS, WSUS…).","courses":["1","2"]},{"id":"Conceptos/XAMPP.md","name":"XAMPP","kind":"concepto","course":"","degree":15,"orphan":false,"anchor":null,"preview":"Paquete gratuito de Apache Friends que instala de una vez un entorno de servidor web local para desarrollo: X (multiplataforma), Apache, MariaDB/MySQL, PHP y Perl, con un panel de control para arrancar cada servicio.","courses":["1","2"]},{"id":"Conceptos/XML.md","name":"XML","kind":"concepto","course":"","degree":16,"orphan":false,"anchor":null,"preview":"eXtensible Markup Language: metalenguaje de marcas del W3C, derivado de SGML, para almacenar e intercambiar datos estructurados entre plataformas. Las etiquetas las define el usuario y con él se crean otros lenguajes (SVG, MathML, RSS, XHTML).","courses":["1"]},{"id":"Conceptos/XPath.md","name":"XPath","kind":"concepto","course":"","degree":10,"orphan":false,"anchor":null,"preview":"Lenguaje de expresiones para seleccionar nodos (elementos, atributos, texto) dentro del árbol de un documento XML. Lo usan XSLT (match, select), XQuery y muchas librerías.","courses":["1"]},{"id":"Conceptos/XSD.md","name":"XSD","kind":"concepto","course":"","degree":7,"orphan":false,"anchor":null,"preview":"XML Schema Definition: lenguaje del W3C, escrito a su vez en XML, para definir y validar la estructura de un documento XML con más precisión que un DTD, incluyendo tipos de datos y restricciones.","courses":["1"]},{"id":"Conceptos/XSLT.md","name":"XSLT","kind":"concepto","course":"","degree":11,"orphan":false,"anchor":null,"preview":"eXtensible Stylesheet Language Transformations: lenguaje de la familia XSL que transforma un documento XML en otro formato (HTML, otro XML, texto o incluso JSON) mediante plantillas.","courses":["1"]},{"id":"Conceptos/Índices.md","name":"Índices","kind":"concepto","course":"","degree":17,"orphan":false,"anchor":null,"preview":"Estructura auxiliar (normalmente un árbol B+) que el SGBD mantiene sobre una o varias columnas para localizar filas rápidamente sin recorrer toda la tabla, como el índice de un libro.","courses":["1"]},{"id":"HOME - FP ASIR.md","name":"HOME - FP ASIR","kind":"hub","course":"","degree":18,"orphan":false,"anchor":null,"preview":"Bóveda de conocimiento del ciclo Administración de Sistem
